<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Deborah Birthday Party</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/imagens/deborah.png" />
  <link rel="shortcut icon" type="image/png" href="/imagens/deborah.png" />
  <link rel="apple-touch-icon" href="/imagens/deborah.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;500&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/auth/styles.css" />
</head>
<body>

<main class="page" aria-label="Página de login">

  <!-- ── Card de Login ── -->
  <div class="card">
    <div class="login-header">
      <div class="logo-container">
        <img src="/imagens/deborah.png" alt="Deborah Birthday Party" class="logo-image" />
      </div>
      
      <h1 class="login-title">Acesso Restrito</h1>
      <p class="login-subtitle">Digite a senha para acessar o dashboard</p>
    </div>

    <form class="login-form" id="loginForm" aria-label="Formulário de login">
      <div class="form-group">
        <label for="password" class="form-label">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="2" y="6" width="10" height="6" rx="1" stroke="currentColor" stroke-width="1.2"/>
            <path d="M4 6V4.5C4 2.8 5.3 2 7 2s3 .8 3 2.5V6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          Senha
        </label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          placeholder="Digite sua senha"
          required
          autocomplete="current-password"
          aria-required="true"
        />
      </div>

      <div class="error-message" id="errorMessage" role="alert" aria-live="polite"></div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-text">Entrar</span>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true" class="btn-icon">
          <path d="M5 2h5a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H5M1 7h8m0 0L6 4m3 3-3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>

  <footer class="page-footer">
    <p>Desenvolvido por <a href="https://github.com/pabloedusilva" target="_blank" rel="noopener noreferrer">Pablo Silva</a></p>
  </footer>

</main>

<script src="/auth/script.js"></script>
</body>
</html>
